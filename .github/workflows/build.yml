name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode release keystore (optional)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.p12"
            echo "KEYSTORE_PATH=${{ runner.temp }}/release.p12" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests and build APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Cleanup temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.p12"

      - name: Prepare APK artifacts
        run: |
          mkdir -p dist dist-debug
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            APK_NAME="tg-ws-proxy-android-${GITHUB_REF_NAME}.apk"
          else
            APK_NAME="tg-ws-proxy-android-release.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
          (cd dist && sha256sum "${APK_NAME}" > SHA256SUMS.txt)
          cp app/build/outputs/apk/debug/app-debug.apk dist-debug/tg-ws-proxy-android-debug.apk
          ls -lh dist/ dist-debug/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-android-apks
          path: |
            dist/*
            dist-debug/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "TG WS Proxy Android ${{ github.ref_name }}"
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
