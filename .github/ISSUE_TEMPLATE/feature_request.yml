name: "Предложить улучшение / Feature request"
description: "Идея новой функции или улучшения интерфейса / Suggest a feature or improvement"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "Какую задачу это решает? / What problem does this solve?"
      placeholder: "Опишите сценарий использования..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Предлагаемое решение / Proposed solution"
      placeholder: "Как это должно работать с точки зрения пользователя?"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Дополнительный контекст / Additional context"
      placeholder: "Ссылки на апстрим Flowseal/tg-ws-proxy, скриншоты, примеры..."
    validations:
      required: false
