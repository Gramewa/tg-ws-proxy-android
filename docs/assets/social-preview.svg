<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1119" />
      <stop offset="58%" stop-color="#0B0D11" />
      <stop offset="100%" stop-color="#090C12" />
    </linearGradient>
    <radialGradient id="navyGlow" cx="82%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#1E4480" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#1E4480" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="14%" cy="92%" r="42%">
      <stop offset="0%" stop-color="#16523A" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#16523A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="waveArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#85B2FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#85B2FF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="iconBg" x1="17%" y1="7%" x2="85%" y2="94%">
      <stop offset="0%" stop-color="#0C0F15" />
      <stop offset="50%" stop-color="#121C2D" />
      <stop offset="100%" stop-color="#162C4E" />
    </linearGradient>
    <clipPath id="iconClip"><rect x="66" y="88" width="54" height="54" rx="14" /></clipPath>
    <clipPath id="phoneFrontClip"><rect x="752" y="42" width="256" height="556" rx="26" /></clipPath>
    <clipPath id="phoneBackClip"><rect x="1028" y="96" width="228" height="494" rx="24" /></clipPath>
  </defs>

  <g id="Background">
    <rect width="1280" height="640" fill="url(#canvasBg)" />
    <rect width="1280" height="640" fill="url(#navyGlow)" />
    <rect width="1280" height="640" fill="url(#emeraldGlow)" />
    <path d="M0,572 C190,564 275,512 435,528 C595,544 715,478 910,494 C1070,508 1175,466 1280,458 L1280,640 L0,640 Z" fill="url(#waveArea)" />
    <path d="M0,572 C190,564 275,512 435,528 C595,544 715,478 910,494 C1070,508 1175,466 1280,458" fill="none" stroke="#85B2FF" stroke-opacity="0.24" stroke-width="2" />
  </g>

  <g id="Brand">
    <g clip-path="url(#iconClip)">
      <rect x="66" y="88" width="54" height="54" fill="url(#iconBg)" />
      <g transform="translate(66 88) scale(0.5)">
        <path d="M30,68 C40,68 45,62 54,63 C63,64 69,57 78,56" fill="none" stroke="#85B2FF" stroke-opacity="0.6" stroke-width="2.6" stroke-linecap="round" />
        <circle cx="78" cy="56" r="3" fill="#4ADE80" />
        <path d="M31.5,47.5 L72.0,32.5 L46.8,52.8 Z" fill="#FFFFFF" />
        <path d="M46.8,52.8 L72.0,32.5 L52.4,56.5 L48.6,65.2 Z" fill="#C6DBFF" />
        <path d="M48.6,65.2 L52.4,56.5 L56.8,60.0 Z" fill="#85B2FF" />
        <path d="M52.4,56.5 L72.0,32.5 L64.4,66.0 Z" fill="#EAF2FF" />
      </g>
    </g>
    <rect x="66.5" y="88.5" width="53" height="53" rx="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" />
    <text x="136" y="124" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#F3F6FC">TG WS Proxy</text>
    <rect x="302" y="102" width="114" height="28" rx="14" fill="#85B2FF" fill-opacity="0.12" stroke="#85B2FF" stroke-opacity="0.25" />
    <text x="359" y="121" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500" fill="#85B2FF">Android 8.0+</text>
  </g>

  <g id="Headline">
    <text x="66" y="216" font-family="Inter, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2" fill="#F5F7FC">Локальный WebSocket-</text>
    <text x="66" y="268" font-family="Inter, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2" fill="#F5F7FC">прокси для Telegram</text>
    <text x="66" y="316" font-family="Inter, sans-serif" font-size="18.5" fill="#A0ABC0">Без VPN, root и сторонних серверов. Паритет с tg-ws-proxy и</text>
    <text x="66" y="344" font-family="Inter, sans-serif" font-size="18.5" fill="#A0ABC0">автопереход на HTTP :80 за 750 мс.</text>
  </g>

  <g id="RouteStrip">
    <rect x="66" y="384" width="560" height="58" rx="16" fill="#131924" stroke="#FFFFFF" stroke-opacity="0.10" />
    <rect x="82" y="398" width="96" height="30" rx="10" fill="#FFFFFF" fill-opacity="0.06" />
    <text x="130" y="418" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13.5" font-weight="600" fill="#ECEFF6">Telegram</text>
    <line x1="188" y1="413" x2="250" y2="413" stroke="#85B2FF" stroke-opacity="0.55" stroke-width="2" />
    <circle cx="222" cy="413" r="4" fill="#85B2FF" />
    <rect x="260" y="398" width="144" height="30" rx="10" fill="#85B2FF" fill-opacity="0.12" />
    <text x="332" y="418" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13.5" font-weight="600" fill="#C7DDFF">127.0.0.1:1443</text>
    <line x1="414" y1="413" x2="468" y2="413" stroke="#4ADE80" stroke-opacity="0.55" stroke-width="2" />
    <circle cx="441" cy="413" r="4" fill="#4ADE80" />
    <rect x="478" y="398" width="132" height="30" rx="10" fill="#4ADE80" fill-opacity="0.14" />
    <circle cx="494" cy="413" r="3.5" fill="#4ADE80" />
    <text x="550" y="418" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#4ADE80">CF :80 (авто)</text>
  </g>

  <g id="Specs">
    <text x="66" y="496" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" fill="#85B2FF">~1.9 МБ</text>
    <text x="66" y="518" font-family="Inter, sans-serif" font-size="13" fill="#7D889E">Pure Kotlin APK</text>
    <line x1="204" y1="482" x2="204" y2="518" stroke="#FFFFFF" stroke-opacity="0.12" />
    <text x="232" y="496" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" fill="#4ADE80">Авто :80 + DoH</text>
    <text x="232" y="518" font-family="Inter, sans-serif" font-size="13" fill="#7D889E">HTTP/2 · Fake TLS</text>
    <line x1="414" y1="482" x2="414" y2="518" stroke="#FFFFFF" stroke-opacity="0.12" />
    <text x="442" y="496" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" fill="#ECEFF6">MIT · FOSS</text>
    <text x="442" y="518" font-family="Inter, sans-serif" font-size="13" fill="#7D889E">без трекеров и рекламы</text>
  </g>

  <g id="Phones">
    <g id="PhoneBack" opacity="0.90">
      <rect x="1020" y="88" width="244" height="510" rx="32" fill="#181F2D" stroke="#FFFFFF" stroke-opacity="0.15" />
      <image href="../screenshots/settings-light.png" x="1028" y="96" width="228" height="494" clip-path="url(#phoneBackClip)" preserveAspectRatio="xMidYMin slice" />
    </g>
    <g id="PhoneFront">
      <rect x="743" y="33" width="274" height="574" rx="34" fill="#1B2333" stroke="#FFFFFF" stroke-opacity="0.20" />
      <image href="../screenshots/simple-dark.png" x="752" y="42" width="256" height="556" clip-path="url(#phoneFrontClip)" preserveAspectRatio="xMidYMin slice" />
    </g>
  </g>
</svg>
